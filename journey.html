<script>
(function(){
  var C=getComputedStyle(document.documentElement);
  var ch=[
    {k:'edu',name:'B.Tech',from:2015,to:2019.5,color:'#8b7cf6',when:'2015 — 2019 · Lucknow',title:'B.Tech, Computer Science',co:'Babu Banarasi Das Engineering College',
     ctx:'Where the foundations came from: databases, programming and the habit of breaking problems into small parts.',
     pts:[['base','Computer Science & Engineering degree, 2015–2019'],['next','Graduated into a data and reporting career that started in 2020']],
     tools:['SQL','Data structures','DBMS'],lesson:'Learn the fundamentals well and every tool after becomes easier.',num:'4',numl:'years of study'},
    {k:'cap',name:'Capgemini',from:2020.45,to:2023.7,color:'#2dd4bf',when:'Jun 2020 — Sep 2023 · Mumbai',title:'Associate Consultant',co:'Capgemini Technology Services',
     ctx:'My Cognos foundation: building reports from scratch for client requirements, end to end.',
     pts:[['build','List, crosstab, grouped, dashboard, drill-down and drill-through reports'],['model','Enhanced Framework Manager models, packages, relationships and data sources'],['sql','Wrote and tuned SQL to validate report logic and output accuracy'],['admin','Installed and configured Cognos on Linux and Windows; managed users, roles and groups'],['people','Worked with clients on KPI definitions; prepared solution documents and end-user training']],
     tools:['Report Studio','Framework Manager','SQL','Linux','Windows'],lesson:'Agree on the KPI definition before writing a single line of SQL.',num:'★',numl:'Best Employee of the Quarter, 2021–22'},
    {k:'man',name:'Manhattan',from:2023.7,to:2024.55,color:'#f472b6',when:'Sep 2023 — Jul 2024 · Bengaluru',title:'Software Engineer (CTSO SCI)',co:'Manhattan Associates',
     ctx:'Where I started reading the reporting environment itself — audit data, logs and performance.',
     pts:[['audit','Built Cognos audit reports on execution history, users, schedules and usage trends'],['find','Identified duplicate, obsolete and underused reports for retirement discussions'],['perf','Root-caused slow reports and environments, cutting report runtimes'],['ops','Installed and upgraded Cognos Analytics across Linux, Windows and GCP'],['model','Built DMR models and multi-level security in Framework Manager']],
     tools:['Cognos 11','Audit DB','Apache HTTP','GCP','Oracle','MSSQL'],lesson:'The audit database is the most honest report in any Cognos environment.',num:'10→11',numl:'Cognos versions upgraded across'},
    {k:'fin',name:'Finastra',from:2024.55,to:2026.85,color:'#f5a524',when:'Jul 2024 — Present · Bengaluru',title:'Software Engineer II (R&D)',co:'Finastra Software Solutions',
     ctx:'Leading Cognos for a shipped product: Datanet and Loan IQ reporting that customers run themselves.',
     pts:[['lead','Lead development of Cognos reports, packages and FM models for Loan IQ and Datanet'],['cert','Certify Cognos Analytics 11.x and 12.x releases against Datanet'],['cloud','Deploy IBM-certified Cognos containers to Azure Kubernetes Service'],['lineage','Trace data lineage across Oracle, SQL Server and PostgreSQL'],['decide','Use audit data and impact analysis to drive consolidation and retirement decisions'],['dqm','Converted CQM models to DQM']],
     tools:['Cognos Analytics 12','AKS','Helm','PostgreSQL','GitHub','JavaScript'],lesson:'In a product, every report is a promise to a customer — change it carefully.',num:'12.x',numl:'latest Cognos release certified'}
  ];
  var track=document.getElementById('track'),tabs=document.getElementById('tabs'),main=document.getElementById('main'),side=document.getElementById('side');
  var Y0=2015,Y1=2027,cur=3;
  function pct(y){return (y-Y0)/(Y1-Y0)*100;}
  for(var y=Y0;y<=Y1-1;y++){var t=document.createElement('div');t.className='tick';t.style.left=pct(y)+'%';t.textContent="'"+String(y).slice(2);track.appendChild(t);}
  ch.forEach(function(c,i){
    var b=document.createElement('button');b.className='seg';b.style.left=pct(c.from)+'%';b.style.width='calc('+(pct(c.to)-pct(c.from))+'% - 4px)';
    b.style.background=c.color;b.style.color=c.color;b.innerHTML='<span style="color:#111">'+c.name+'</span>';b.onclick=function(){show(i);};track.appendChild(b);c.seg=b;
    var tb=document.createElement('button');tb.className='tab';tb.innerHTML='<i style="background:'+c.color+'"></i>'+c.name;tb.onclick=function(){show(i);};tabs.appendChild(tb);c.tab=tb;
  });
  function show(i){
    cur=i;var c=ch[i];
    ch.forEach(function(x,j){x.seg.classList.toggle('on',j===i);x.tab.classList.toggle('on',j===i);});
    main.innerHTML='<div class="when">'+c.when+'</div><h2>'+c.title+'</h2><div class="co" style="color:'+c.color+'">'+c.co+'</div><p class="ctx">'+c.ctx+'</p><ul>'+
      c.pts.map(function(p,k){return'<li style="animation-delay:'+(k*70)+'ms"><span class="k">'+p[0]+'</span><span>'+p[1]+'</span></li>';}).join('')+'</ul>';
    side.innerHTML='<div><div class="big-num" style="color:'+c.color+'">'+c.num+'</div><div class="hint">'+c.numl+'</div></div>'+
      '<div><h4>Tools in play</h4><div class="chips">'+c.tools.map(function(t){return'<span class="chip">'+t+'</span>';}).join('')+'</div></div>'+
      '<div><h4>What it taught me</h4><p style="font-size:15px">“'+c.lesson+'”</p></div>'+
      '<div class="nav-arrows"><button class="btn" id="prev">← Prev</button><button class="btn" id="next">Next →</button></div>';
    document.getElementById('prev').onclick=function(){show((cur+ch.length-1)%ch.length);};
    document.getElementById('next').onclick=function(){show((cur+1)%ch.length);};
  }
  document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')show((cur+1)%ch.length);if(e.key==='ArrowLeft')show((cur+ch.length-1)%ch.length);});
  show(3);
})();
</script>
